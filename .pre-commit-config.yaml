repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6  # verify current release before use
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests -q
        language: system
        pass_filenames: false
        types: [python]
